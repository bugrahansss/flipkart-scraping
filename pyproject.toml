[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flipkart-scraping"
version = "0.1.0"
description = "Scrape Flipkart search results, product details and reviews with Python, from the page's own JSON state."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["flipkart", "web scraping", "scraper", "ecommerce", "price tracking", "reviews", "india"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/flipkart-scraping"
Source = "https://github.com/bugrahansss/flipkart-scraping"
Issues = "https://github.com/bugrahansss/flipkart-scraping/issues"
Guide = "https://scrape.do/?utm_source=pypi&utm_medium=package&utm_campaign=flipkart-scraping"

[project.scripts]
flipkart-scraping = "flipkart_scraping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
